<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flexbox Layout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
        }

        .page {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            height: 80px;
            background: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main {
            display: flex;
            flex: 1;
        }

        nav {
            width: 220px;
            background: #eee;
            padding: 20px;
        }

        nav a {
            display: block;
            margin-bottom: 15px;
            text-decoration: none;
            color: #333;
        }

        .content {
            flex: 1;
            padding: 30px;
        }

        @media (max-width: 600px) {
            .main {
                flex-direction: column;
            }

            nav {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header>
        <h1>Student Portal</h1>
    </header>

    <div class="main">

        <nav>
            <a href="#">Home</a>
            <a href="#">Students</a>
            <a href="#">Courses</a>
            <a href="#">Contact</a>
        </nav>

        <main class="content">
            <h2>Welcome to Student Portal </h2>
            <p>This layout behaves like a traditional frame layout using CSS Flexbox.</p>
        </main>

    </div>
</div>

</body>
</html>
