
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        /* Flexbox Container */
        .container {
            display: flex;
            gap: 30px;
            max-width: 900px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        /* Contact Form Section */
        .contact-form,
        .company-info {
            flex: 1;
            padding: 20px;
        }

        h2 {
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        /* Company Location Details */
        .company-info {
            background-color: #eff6ff;
            border-radius: 8px;
            line-height: 1.8;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <h1>Contact Us</h1>

    <div class="container">

        <!-- Contact Form -->
        <div class="contact-form">
            <h2>Send Us a Message</h2>

            <form>
                <label for="name">Name:</label>
                <input type="text" id="name"
                       placeholder="Enter your name" required>

                <label for="email">Email:</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>

                <label for="message">Message:</label>
                <textarea id="message"
                          placeholder="Write your message"
                          required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>

        <!-- Company Location Details -->
        <div class="company-info">
            <h2>Our Location</h2>

            <p><strong>Company:</strong> ABC Solutions</p>
            <p><strong>Address:</strong> Dehradun, Uttarakhand, India</p>
            <p><strong>Email:</strong> info@abc.com</p>
            <p><strong>Phone:</strong> +91 9876543210</p>
            <p><strong>Working Hours:</strong> Monday - Friday, 9 AM - 5 PM</p>
        </div>

    </div>

</body>
</html>
