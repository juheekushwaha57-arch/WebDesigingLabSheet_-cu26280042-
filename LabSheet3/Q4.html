
<!DOCTYPE html>
<html>
<head>
    <title>Fibonacci Series</title>
</head>
<body>
    <h2>Fibonacci Series</h2>
    <input type="number" id="terms" placeholder="Enter number of terms">
    <button onclick="generate()">Generate</button>
    <p id="result"></p>

    <script>
        function generate() {
            let n = Number(document.getElementById("terms").value);

            if (!Number.isInteger(n) || n < 1 || n > 100) {
                document.getElementById("result").textContent =
                    "Enter a number from 1 to 100.";
                return;
            }

            let a = 0, b = 1;
            let series = [];

            for (let i = 0; i < n; i++) {
                series.push(a);
                let next = a + b;
                a = b;
                b = next;
            }

            document.getElementById("result").textContent =
                "Fibonacci Series: " + series.join(", ");
        }
    </script>
</body>
</html>
